<template>
  <lightning-modal-header label={labels.title}></lightning-modal-header>
  <lightning-modal-body>
    <template lwc:if={isLoading}>
      <lightning-spinner
        alternative-text={labels.title}
        size="small"
      ></lightning-spinner>
    </template>
    <template lwc:if={errorMessage}>
      <div class="slds-text-color_error" role="alert">{errorMessage}</div>
    </template>
    <template lwc:if={invite}>
      <p class="slds-var-m-bottom_small">{labels.scan}</p>
      <!-- Drawn from the invite link by the qrcode static resource; no HTML is injected -->
      <canvas
        class="line-qr"
        width={canvasSize}
        height={canvasSize}
        aria-label={labels.title}
        role="img"
      ></canvas>
      <p
        class="slds-text-align_center slds-text-color_weak slds-var-m-top_x-small"
      >
        {throughOaText}
      </p>
      <p class="slds-text-align_center slds-text-color_weak">{expiresText}</p>
      <div class="slds-grid slds-grid_vertical-align-end slds-var-m-top_medium">
        <div class="slds-col">
          <lightning-input
            label={labels.link}
            value={invite.url}
            read-only
            data-id="invite-url"
          ></lightning-input>
        </div>
        <div class="slds-col slds-grow-none slds-var-m-left_x-small">
          <lightning-button
            label={copyLabel}
            icon-name="utility:copy"
            onclick={handleCopy}
          ></lightning-button>
        </div>
      </div>
    </template>
  </lightning-modal-body>
  <lightning-modal-footer>
    <lightning-button
      label={labels.newCode}
      onclick={handleNewCode}
      disabled={isLoading}
    ></lightning-button>
    <lightning-button
      class="slds-var-m-left_x-small"
      variant="brand"
      label={labels.close}
      onclick={handleClose}
    ></lightning-button>
  </lightning-modal-footer>
</template>
