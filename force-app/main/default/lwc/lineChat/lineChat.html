<template>
  <lightning-card title={labels.title} icon-name="standard:messaging_user">
    <!-- Link to another Contact (DEC-44): hidden until the business wants it; the code behind it stays.
    <template lwc:if={hasConversations}>
      <lightning-button-icon
        slot="actions"
        icon-name="utility:link"
        data-id="link-toggle"
        alternative-text={labels.linkAction}
        title={labels.linkAction}
        onclick={handleToggleLink}
      ></lightning-button-icon>
    </template>
    -->
    <!-- Grey line under the card header; the header itself belongs to lightning-card and can't be styled -->
    <div class="line-header-divider" data-id="header-divider"></div>
    <div class="slds-var-p-horizontal_small">
      <template lwc:if={isLoading}>
        <lightning-spinner
          alternative-text={labels.title}
          size="small"
        ></lightning-spinner>
      </template>

      <template lwc:if={errorMessage}>
        <div
          class="slds-text-color_error slds-var-m-bottom_x-small"
          role="alert"
        >
          {errorMessage}
        </div>
      </template>

      <!-- No conversation yet: the rep invites the customer (wired in M6) -->
      <template lwc:if={showEmptyState}>
        <div
          class="slds-align_absolute-center slds-var-p-vertical_medium slds-text-align_center"
        >
          <div>
            <p class="slds-text-color_weak slds-var-m-bottom_small">
              {labels.noConversations}
            </p>
            <lightning-button
              label={labels.invite}
              icon-name="utility:share"
              onclick={handleInvite}
            ></lightning-button>
          </div>
        </div>
      </template>
      <template lwc:elseif={hasConversations}>
        <!-- One tab per OA when the customer talks to more than one rep -->
        <template lwc:if={hasMultipleConversations}>
          <div class="slds-var-m-bottom_x-small">
            <template for:each={conversations} for:item="conversation">
              <button
                key={conversation.id}
                class="slds-button slds-button_neutral slds-var-m-right_xx-small"
                data-id={conversation.id}
                onclick={handleConversationSelect}
              >
                {conversation.oaName}
              </button>
            </template>
          </div>
        </template>

        <!-- DEC-44: move this chat to another Contact (e.g. off the one LINE Connect created) -->
        <template lwc:if={showLinkPanel}>
          <div
            class="slds-box slds-box_x-small slds-var-m-bottom_x-small"
            data-id="link-panel"
          >
            <lightning-record-picker
              label={labels.linkContact}
              object-api-name="Contact"
              value={pickedContactId}
              onchange={handleContactPick}
            ></lightning-record-picker>
            <div class="slds-var-m-top_x-small">
              <lightning-button
                variant="brand"
                label={labels.link}
                disabled={isLinkDisabled}
                onclick={handleLink}
              ></lightning-button>
              <lightning-button
                class="slds-var-m-left_x-small"
                label={labels.cancel}
                onclick={handleToggleLink}
              ></lightning-button>
              <template lwc:if={canUnlink}>
                <lightning-button
                  class="slds-var-m-left_x-small"
                  variant="destructive-text"
                  label={labels.unlink}
                  onclick={handleUnlink}
                ></lightning-button>
              </template>
            </div>
          </div>
        </template>

        <template lwc:if={showUnfollowedBanner}>
          <div class="slds-var-m-bottom_x-small">
            <lightning-icon
              icon-name="utility:warning"
              size="x-small"
              variant="warning"
            ></lightning-icon>
            <span class="slds-var-m-left_xx-small slds-text-color_weak"
              >{labels.unfollowed}</span
            >
          </div>
        </template>

        <template lwc:if={showReadOnlyNotice}>
          <div class="slds-var-m-bottom_x-small" data-id="read-only-notice">
            <lightning-icon
              icon-name="utility:lock"
              size="x-small"
            ></lightning-icon>
            <span class="slds-var-m-left_xx-small slds-text-color_weak"
              >{labels.notAssignedRep}</span
            >
          </div>
        </template>

        <div class="line-messages slds-scrollable_y" onscroll={handleScroll}>
          <template lwc:if={hasMore}>
            <div class="slds-align_absolute-center slds-var-m-bottom_x-small">
              <lightning-button
                label={labels.loadOlder}
                variant="base"
                onclick={handleLoadOlder}
              ></lightning-button>
            </div>
          </template>

          <template lwc:if={showNoMessages}>
            <p
              class="slds-text-color_weak slds-align_absolute-center slds-var-p-vertical_medium"
            >
              {labels.noMessages}
            </p>
          </template>

          <template for:each={messageViews} for:item="message">
            <div key={message.key} class={message.rowClass}>
              <div class={message.bubbleClass}>
                <!-- Message text is rendered as text, never as HTML (09 §7) -->
                <template lwc:if={message.isText}>
                  <p class="line-text">{message.text}</p>
                </template>
                <!-- Sticker picture from LINE's CDN (DEC-32); the URL is built server-side from a numeric sticker ID -->
                <template lwc:elseif={message.showSticker}>
                  <img
                    class="line-sticker"
                    src={message.stickerUrl}
                    alt={labels.sticker}
                    data-id={message.id}
                    loading="lazy"
                    onerror={handleStickerError}
                  />
                </template>
                <!-- M7: a customer's or rep's image, saved as a Salesforce File -->
                <template lwc:elseif={message.showImage}>
                  <button
                    class="slds-button line-file-button"
                    data-document-id={message.contentDocumentId}
                    title={labels.openFile}
                    onclick={handleOpenFile}
                  >
                    <img
                      class="line-image"
                      src={message.thumbnailUrl}
                      alt={message.fileLabel}
                      loading="lazy"
                    />
                  </button>
                </template>
                <template lwc:elseif={message.showFile}>
                  <button
                    class="slds-button line-file-button slds-grid slds-grid_vertical-align-center"
                    data-document-id={message.contentDocumentId}
                    title={labels.openFile}
                    onclick={handleOpenFile}
                  >
                    <lightning-icon
                      icon-name="doctype:attachment"
                      size="small"
                    ></lightning-icon>
                    <span class="slds-var-m-left_x-small line-text"
                      >{message.fileLabel}</span
                    >
                  </button>
                </template>
                <template lwc:else>
                  <p class="slds-text-color_weak">{message.placeholder}</p>
                </template>
                <template lwc:if={message.statusText}>
                  <p
                    class="slds-text-body_small slds-text-color_weak"
                    data-id="file-status"
                  >
                    {message.statusText}
                  </p>
                </template>

                <div
                  class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small"
                >
                  <lightning-formatted-date-time
                    value={message.sentAt}
                    hour="2-digit"
                    minute="2-digit"
                    day="numeric"
                    month="short"
                  ></lightning-formatted-date-time>
                  <template lwc:if={message.isFailed}>
                    <span
                      class="slds-text-color_error slds-var-m-left_xx-small"
                    >
                      {message.failedLabel}
                      <template lwc:if={message.failedDetail}>
                        — {message.failedDetail}
                      </template>
                    </span>
                  </template>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Composer, laid out like LINE's (DEC-44): file, photo, text, sticker, send -->
        <div class="slds-var-m-top_x-small">
          <template lwc:if={showUploadTray}>
            <div
              class="slds-box slds-box_x-small slds-var-m-bottom_x-small"
              data-id="upload-tray"
            >
              <!-- M7: saved on the conversation, then sent as a picture or an expiring link (DEC-43) -->
              <lightning-file-upload
                label={uploadLabel}
                name="lineFile"
                record-id={selectedConversationId}
                accept={uploadAccept}
                disabled={isUploadDisabled}
                onuploadfinished={handleUploadFinished}
              ></lightning-file-upload>
            </div>
          </template>
          <template lwc:if={showStickerTray}>
            <div
              class="slds-box slds-box_x-small slds-var-m-bottom_x-small"
              data-id="sticker-tray"
            >
              <div class="slds-var-m-bottom_x-small">
                <template for:each={stickerPacks} for:item="pack">
                  <button
                    key={pack.packageId}
                    class={pack.tabClass}
                    data-package={pack.packageId}
                    title={labels.stickers}
                    onclick={handleStickerPack}
                  >
                    <img class="line-sticker-tab" src={pack.coverUrl} alt="" />
                  </button>
                </template>
              </div>
              <div class="line-sticker-grid">
                <template for:each={activeStickers} for:item="sticker">
                  <button
                    key={sticker.stickerId}
                    class="slds-button line-sticker-choice"
                    data-package={sticker.packageId}
                    data-sticker={sticker.stickerId}
                    title={labels.stickers}
                    onclick={handleStickerSend}
                  >
                    <img
                      class="line-sticker-option"
                      src={sticker.url}
                      alt={labels.sticker}
                      loading="lazy"
                    />
                  </button>
                </template>
              </div>
            </div>
          </template>

          <lightning-textarea
            label={labels.inputPlaceholder}
            variant="label-hidden"
            placeholder={labels.inputPlaceholder}
            value={draft}
            max-length={maxLength}
            onchange={handleDraftChange}
            onkeydown={handleKeyDown}
          ></lightning-textarea>
          <!-- Below the message box: attach, photo and sticker on the left (grey, smaller), Send on the right -->
          <div
            class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-var-m-top_xx-small"
          >
            <div
              class="slds-grid slds-grid_vertical-align-center"
              data-id="composer-tools"
            >
              <button
                class="slds-button slds-button_icon line-tool"
                title={labels.attach}
                disabled={isUploadDisabled}
                data-id="open-files"
                onclick={handleOpenFiles}
              >
                <lightning-icon
                  icon-name="utility:add"
                  size="small"
                  alternative-text={labels.attach}
                ></lightning-icon>
              </button>
              <button
                class="slds-button slds-button_icon line-tool"
                title={labels.photo}
                disabled={isUploadDisabled}
                data-id="open-photos"
                onclick={handleOpenPhotos}
              >
                <lightning-icon
                  icon-name="utility:image"
                  size="small"
                  alternative-text={labels.photo}
                ></lightning-icon>
              </button>
              <button
                class="slds-button slds-button_icon line-tool"
                title={labels.stickers}
                disabled={isUploadDisabled}
                data-id="open-stickers"
                onclick={handleToggleStickers}
              >
                <lightning-icon
                  icon-name="utility:smiley_and_people"
                  size="small"
                  alternative-text={labels.stickers}
                ></lightning-icon>
              </button>
            </div>
            <lightning-button
              variant="brand"
              label={labels.send}
              disabled={isSendDisabled}
              onclick={handleSend}
            ></lightning-button>
          </div>
          <p
            class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small"
          >
            {labels.sendHint}
          </p>
        </div>
      </template>
    </div>
  </lightning-card>
</template>
